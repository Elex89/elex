<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gravity Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070a;
    --fg:#f2f2ee;
    --dim:#5a5a63;
    --accent:#ffb020;
    --accent-dim:#7a5a1c;
    --danger:#ff5c5c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    color:var(--fg);
  }
  #wrap{
    position:fixed; inset:0;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  canvas{ display:block; width:100%; height:100%; }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:radial-gradient(ellipse at 50% 40%, rgba(255,176,32,0.06), transparent 60%);
  }
  .hidden{ display:none !important; }

  .title{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:clamp(34px, 10vw, 52px);
    letter-spacing:0.5px;
    margin:0 0 6px 0;
    line-height:1;
  }
  .title span{ color:var(--accent); }

  .subtitle{
    color:var(--dim);
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin:0 0 34px 0;
  }

  .hint{
    font-size:14px;
    color:var(--fg);
    opacity:0.8;
    margin:6px 0;
    max-width:280px;
    line-height:1.5;
  }

  .cta{
    margin-top:28px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:1px;
    color:var(--bg);
    background:var(--accent);
    padding:14px 34px;
    border-radius:999px;
    border:none;
    box-shadow:0 0 0 1px rgba(255,176,32,0.3), 0 8px 24px rgba(255,176,32,0.18);
  }

  .diff-label{
    font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--dim); margin:26px 0 12px 0;
  }
  .diff-row{
    display:flex; gap:10px;
  }
  .diff-btn{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.5px;
    color:var(--fg);
    background:transparent;
    border:1px solid rgba(255,255,255,0.16);
    padding:12px 18px;
    border-radius:12px;
    min-width:84px;
  }
  .diff-btn .sub{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:400;
    font-size:9px;
    letter-spacing:1px;
    color:var(--dim);
    margin-top:3px;
  }
  .diff-btn.selected{
    border-color:var(--accent);
    background:rgba(255,176,32,0.1);
    color:var(--accent);
  }
  .diff-btn.selected .sub{ color:var(--accent-dim); }

  .change-diff{
    margin-top:14px;
    background:none; border:none;
    color:var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:1px;
    text-decoration:underline;
  }

  .stat-row{
    display:flex; gap:36px; margin:18px 0 8px 0;
  }
  .stat{ text-align:center; }
  .stat .num{ font-size:30px; font-weight:700; font-family:'Chakra Petch', sans-serif; }
  .stat .lbl{ font-size:10px; color:var(--dim); letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; }
  .stat .num.best{ color:var(--accent); }

  #hud{
    position:absolute; top:calc(env(safe-area-inset-top) + 16px); left:0; right:0;
    display:flex; justify-content:space-between; padding:0 20px;
    font-size:13px; letter-spacing:1px; color:var(--dim);
    pointer-events:none;
  }
  #hud .score{ color:var(--fg); font-size:22px; font-weight:700; font-family:'Chakra Petch', sans-serif; }

  .newbest{
    color:var(--accent); font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    margin-top:2px; height:16px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div>
      <div class="score" id="liveScore">0</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;">BEST</div>
      <div style="font-size:16px; color:var(--fg)" id="liveBest">0</div>
    </div>
  </div>

  <div id="startScreen" class="overlay">
    <h1 class="title">GRAVITY<br><span>FLIP</span></h1>
    <p class="subtitle">Ein Tap kehrt alles um</p>
    <p class="hint">Tippe auf den Bildschirm, um die Schwerkraft umzukehren und den Barrieren auszuweichen.</p>
    <p class="hint" style="opacity:0.5; font-size:12px;">Je länger du überlebst, desto schneller wird es.</p>

    <div class="diff-label">Schwierigkeit</div>
    <div class="diff-row" id="diffRow">
      <button class="diff-btn" data-diff="easy">Einfach<span class="sub">langsam</span></button>
      <button class="diff-btn selected" data-diff="normal">Normal<span class="sub">ausgewogen</span></button>
      <button class="diff-btn" data-diff="hard">Schwer<span class="sub">hart</span></button>
    </div>

    <button class="cta" id="startBtn">TIPPEN ZUM START</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <p class="subtitle" style="margin-bottom:10px;">GAME OVER</p>
    <div class="stat-row">
      <div class="stat">
        <div class="num" id="finalScore">0</div>
        <div class="lbl">Punkte</div>
      </div>
      <div class="stat">
        <div class="num best" id="finalBest">0</div>
        <div class="lbl">Bestleistung</div>
      </div>
    </div>
    <div class="newbest" id="newBestTag"></div>
    <button class="cta" id="retryBtn">NOCHMAL SPIELEN</button>
    <button class="change-diff" id="changeDiffBtn">Schwierigkeit ändern</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const hud = document.getElementById('hud');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const liveScoreEl = document.getElementById('liveScore');
  const liveBestEl = document.getElementById('liveBest');
  const finalScoreEl = document.getElementById('finalScore');
  const finalBestEl = document.getElementById('finalBest');
  const newBestTag = document.getElementById('newBestTag');

  let dpr = Math.min(window.devicePixelRatio || 1, 3);
  let W = 0, H = 0;

  function resize(){
    const rect = wrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- persistent highscore ----------
  const STORAGE_KEY = 'gravityflip:best';
  let best = 0;
  async function loadBest(){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){ best = parseInt(res.value, 10) || 0; }
    }catch(e){ best = 0; }
    liveBestEl.textContent = best;
  }
  async function saveBest(v){
    try{ await window.storage.set(STORAGE_KEY, String(v)); }catch(e){}
  }
  loadBest();

  // ---------- game constants ----------
  const LANE_MARGIN = 0.16;      // lane center distance from top/bottom, as fraction of H
  const PLAYER_X_FRAC = 0.24;    // fixed x position of player
  const PLAYER_SIZE_FRAC = 0.052;
  const FLIP_MS = 130;
  const OBST_WIDTH_FRAC = 0.052;

  const DIFFICULTIES = {
    easy:   { baseSpeed:230, maxSpeed:430, rampTime:60, baseGap:1300, minGap:760 },
    normal: { baseSpeed:300, maxSpeed:620, rampTime:45, baseGap:1050, minGap:560 },
    hard:   { baseSpeed:380, maxSpeed:800, rampTime:32, baseGap:850,  minGap:430 }
  };
  let diffKey = 'normal';
  let diff = DIFFICULTIES[diffKey];

  const diffRow = document.getElementById('diffRow');
  const changeDiffBtn = document.getElementById('changeDiffBtn');
  diffRow.addEventListener('click', (e)=>{
    const btn = e.target.closest('.diff-btn');
    if(!btn) return;
    diffKey = btn.dataset.diff;
    diff = DIFFICULTIES[diffKey];
    [...diffRow.children].forEach(b => b.classList.toggle('selected', b === btn));
  });
  changeDiffBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    overScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    state = 'start';
  });

  let state = 'start'; // start | playing | over
  let player = { lane: 1, y: 0, targetY: 0, flipStart: 0, flipping:false, fromY:0 };
  let obstacles = [];
  let particles = [];
  let trail = [];
  let score = 0;
  let elapsed = 0;
  let lastSpawn = 0;
  let nextGap = 1000;
  let lastTime = 0;
  let shake = 0;

  function laneY(lane){
    // lane 0 = top, lane 1 = bottom
    return lane === 0 ? H * LANE_MARGIN : H * (1 - LANE_MARGIN);
  }

  function reset(){
    player.lane = 1;
    player.y = laneY(1);
    player.targetY = player.y;
    player.flipping = false;
    obstacles = [];
    particles = [];
    trail = [];
    score = 0;
    elapsed = 0;
    lastSpawn = 0;
    nextGap = diff.baseGap;
    shake = 0;
  }

  function currentSpeed(){
    const t = Math.min(elapsed / diff.rampTime, 1);
    // ease-out ramp
    const eased = 1 - Math.pow(1-t, 2);
    return diff.baseSpeed + (diff.maxSpeed - diff.baseSpeed) * eased;
  }

  function currentGapMs(){
    const t = Math.min(elapsed / diff.rampTime, 1);
    const eased = 1 - Math.pow(1-t, 2);
    return diff.baseGap + (diff.minGap - diff.baseGap) * eased;
  }

  function flip(){
    if(state !== 'playing') return;
    player.lane = player.lane === 0 ? 1 : 0;
    player.fromY = player.y;
    player.targetY = laneY(player.lane);
    player.flipping = true;
    player.flipStart = performance.now();
    trail.push({y: player.fromY, t: performance.now()});
  }

  function spawnObstacle(){
    const lane = Math.random() < 0.5 ? 0 : 1;
    const h = H * 0.09;
    obstacles.push({
      x: W + 20,
      lane: lane,
      y: laneY(lane),
      h: h,
      passed: false
    });
  }

  function burst(x,y,color,n){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 60 + Math.random()*160;
      particles.push({
        x,y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        life: 1,
        color
      });
    }
  }

  function gameOver(){
    state = 'over';
    hud.classList.add('hidden');
    shake = 18;
    burst(player.x_cached, player.y, '#ff5c5c', 26);
    const s = Math.floor(score);
    finalScoreEl.textContent = s;
    const isNew = s > best;
    if(isNew){
      best = s;
      saveBest(best);
    }
    finalBestEl.textContent = best;
    newBestTag.textContent = isNew ? 'NEUE BESTLEISTUNG' : '';
    setTimeout(()=>{ overScreen.classList.remove('hidden'); }, 260);
  }

  function update(dt, now){
    elapsed += dt;
    score += dt * 8; // trickle score over time

    // player flip animation
    if(player.flipping){
      const t = Math.min((now - player.flipStart)/FLIP_MS, 1);
      const ease = 1 - Math.pow(1-t, 3);
      player.y = player.fromY + (player.targetY - player.fromY) * ease;
      if(t >= 1){ player.flipping = false; player.y = player.targetY; }
    }

    // trail fade cleanup
    trail = trail.filter(tr => now - tr.t < 260);

    const speed = currentSpeed();
    const px = W * PLAYER_X_FRAC;
    const psize = H * PLAYER_SIZE_FRAC;
    player.x_cached = px;

    // spawn
    if(now - lastSpawn > nextGap){
      spawnObstacle();
      lastSpawn = now;
      nextGap = currentGapMs() * (0.85 + Math.random()*0.3);
    }

    // move + collide
    for(const o of obstacles){
      o.x -= speed * dt;
      if(!o.passed && o.x + (W*OBST_WIDTH_FRAC) < px - psize){
        o.passed = true;
        score += 10;
      }
      // collision check: same lane & overlapping x range near player
      const ow = W * OBST_WIDTH_FRAC;
      const overlapX = (o.x < px + psize) && (o.x + ow > px - psize);
      const sameLaneBand = Math.abs(o.y - player.y) < psize + o.h*0.5;
      if(overlapX && sameLaneBand){
        gameOver();
      }
    }
    obstacles = obstacles.filter(o => o.x > -60);

    // particles
    for(const p of particles){
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt*1.6;
    }
    particles = particles.filter(p => p.life > 0);

    if(shake > 0) shake = Math.max(0, shake - dt*40);
  }

  function draw(now){
    ctx.clearRect(0,0,W,H);

    let ox = 0, oy = 0;
    if(shake > 0){
      ox = (Math.random()-0.5)*shake;
      oy = (Math.random()-0.5)*shake;
    }
    ctx.save();
    ctx.translate(ox,oy);

    // background gradient wash
    const g = ctx.createRadialGradient(W*0.24,H*0.5,0, W*0.24,H*0.5, W*0.9);
    g.addColorStop(0,'rgba(255,176,32,0.05)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // gravity divider line (signature element)
    const midY = H/2;
    const pulse = state === 'playing' ? (0.5 + 0.5*Math.sin(now/220)) : 0.3;
    ctx.strokeStyle = `rgba(255,176,32,${0.12 + pulse*0.12})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([2,10]);
    ctx.beginPath();
    ctx.moveTo(0, midY);
    ctx.lineTo(W, midY);
    ctx.stroke();
    ctx.setLineDash([]);

    // lane guide ticks
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath();
    ctx.moveTo(0, laneY(0)); ctx.lineTo(W, laneY(0));
    ctx.moveTo(0, laneY(1)); ctx.lineTo(W, laneY(1));
    ctx.stroke();

    if(state === 'playing' || state === 'over'){
      const px = W * PLAYER_X_FRAC;
      const psize = H * PLAYER_SIZE_FRAC;
      const ow = W * OBST_WIDTH_FRAC;

      // obstacles
      for(const o of obstacles){
        const glow = ctx.createLinearGradient(o.x,0,o.x+ow,0);
        glow.addColorStop(0,'rgba(255,176,32,0.0)');
        glow.addColorStop(1,'rgba(255,176,32,0.9)');
        ctx.fillStyle = glow;
        roundRect(o.x, o.y - o.h/2, ow, o.h, 6);
        ctx.fill();
      }

      // player trail (afterimage on flip)
      for(const tr of trail){
        const age = (now - tr.t)/260;
        ctx.globalAlpha = Math.max(0, 1-age) * 0.35;
        ctx.fillStyle = '#f2f2ee';
        roundRect(px - psize, tr.y - psize, psize*2, psize*2, 8);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // player
      ctx.fillStyle = state === 'over' ? '#ff5c5c' : '#f2f2ee';
      ctx.shadowColor = state === 'over' ? 'rgba(255,92,92,0.6)' : 'rgba(255,255,255,0.4)';
      ctx.shadowBlur = 14;
      roundRect(px - psize, player.y - psize, psize*2, psize*2, 8);
      ctx.fill();
      ctx.shadowBlur = 0;

      // particles
      for(const p of particles){
        ctx.globalAlpha = Math.max(0,p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(now){
    if(!lastTime) lastTime = now;
    const dt = Math.min((now - lastTime)/1000, 0.033);
    lastTime = now;

    if(state === 'playing'){
      update(dt, now);
      liveScoreEl.textContent = Math.floor(score);
      liveBestEl.textContent = Math.max(best, Math.floor(score));
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  function startGame(){
    reset();
    player.y = laneY(1);
    player.targetY = player.y;
    state = 'playing';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    lastSpawn = performance.now();
    lastTime = 0;
  }

  startBtn.addEventListener('click', (e)=>{ e.preventDefault(); startGame(); });
  retryBtn.addEventListener('click', (e)=>{ e.preventDefault(); startGame(); });

  wrap.addEventListener('pointerdown', (e)=>{
    if(state === 'playing'){
      flip();
    }
  });

  document.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
  document.addEventListener('dblclick', (e)=>{ e.preventDefault(); });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
